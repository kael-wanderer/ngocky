services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ngocky-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: ${APP_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://ngocky:${DB_PASSWORD:-ngocky_secret}@postgres:5432/ngocky?schema=public}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_EXPIRY: ${JWT_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-dev-assistant-key-change-me}
      OWNER_NAME: ${OWNER_NAME:-Owner}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      ALLOW_PRIVATE_AGENT_ENDPOINTS: ${ALLOW_PRIVATE_AGENT_ENDPOINTS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-3001}:3001"
    networks:
      - ngocky

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: ngocky-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"
    networks:
      - ngocky

  postgres:
    image: postgres:16-alpine
    container_name: ngocky-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ngocky
      POSTGRES_USER: ngocky
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ngocky_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ngocky" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ngocky

volumes:
  pgdata:


networks:
  ngocky:
    driver: bridge
